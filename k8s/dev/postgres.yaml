apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: learning-tracker-postgres-data
  namespace: learning-tracker-dev
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: learning-tracker-postgres
  namespace: learning-tracker-dev
spec:
  selector:
    app: learning-tracker-postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-tracker-postgres
  namespace: learning-tracker-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: learning-tracker-postgres
  template:
    metadata:
      labels:
        app: learning-tracker-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: learning_tracker
            - name: POSTGRES_USER
              value: learning_tracker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: learning-tracker-db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: learning-tracker-postgres-data
