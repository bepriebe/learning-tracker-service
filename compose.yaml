services:
  app:
    build:
      context: .
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/learning_tracker
      DB_USERNAME: learning_tracker
      DB_PASSWORD: learning_tracker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: learning_tracker
      POSTGRES_USER: learning_tracker
      POSTGRES_PASSWORD: learning_tracker

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_tracker -d learning_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:9.15
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: local-development
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  test:
    image: eclipse-temurin:21-jdk
    working_dir: /workspace
    command: ./mvnw test
    profiles:
      - test
    volumes:
      - .:/workspace:ro
      - maven-cache:/root/.m2
      - test-target:/workspace/target

volumes:
  postgres-data:
  maven-cache:
  pgadmin-data:
  test-target:
